syntax = "proto3";

package spotify.login5.v3.challenges;

message CodeChallenge {
  .spotify.login5.v3.challenges.CodeChallenge.Method method = 1;

  int32 code_length = 2;

  int32 expires_in = 3;

  string canonical_phone_number = 4;

  enum Method {
