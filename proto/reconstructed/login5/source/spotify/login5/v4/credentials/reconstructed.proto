// RECONSTRUCTED Login5 schema; not an extracted original descriptor.
// Native wire facts: docs/evidence/login5-lite-tables.json.
// Per-field provenance: proto/reconstructed/login5/manifest.json.
// Original filenames/source options/optional declarations remain unestablished.

syntax = "proto3";

package spotify.login5.v4.credentials;

message StoredCredential {
  string username = 1;

  bytes data = 2;
}

message Password {
  string login_hint = 1;
}

message FacebookAccessToken {
  string fb_uid = 1;

  string access_token = 2;

  string id_token = 3;
}

message OneTimeToken {
  string token = 1;
}

message ParentChildCredential {
  string child_id = 1;

  .spotify.login5.v4.credentials.StoredCredential parent_stored_credential = 2;
}

message AppleSignInCredential {
  string auth_code = 1;

  string redirect_uri = 2;

  string bundle_id = 3;
}

message SamsungSignInCredential {
  string auth_code = 1;

  string redirect_uri = 2;

  string id_token = 3;

  string token_endpoint_url = 4;
}

message GoogleSignInCredential {
  string auth_code = 1;

  string redirect_uri = 2;

  string id_token = 3;
}

message NaverSignInCredential {
  string auth_code = 1;

  string redirect_uri = 2;
}

message NativePassword {
  string id = 1;

  string password = 2;

  bytes padding = 3;
}

message AuthnPlatformCredential {
}
